<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voxel Plane Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      overflow: hidden;
      background: #87CEEB;
    }
    canvas {
      display: block;
    }
    #instructions {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 15px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 14px;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div id="instructions">
    <strong>Controls:</strong><br/>
    W/S - Forward/Back<br/>
    A/D - Left/Right<br/>
    Space/Shift - Up/Down<br/>
    Q/E - Rotate Left/Right
  </div>
  <script type="module" src="/main.js"></script>
</body>
</html>
